# Past editions of enicar.org's Watch Value Barometer, quoted as published
# (permission confirmed by the owner, 2026-10-25). The current edition lives
# in each record's `barometer`; this file holds the earlier ones for the
# price-history chart. Each series is keyed by the label the current edition
# uses (`current`), and each past entry keeps the label that edition used,
# since categories were split and renamed over the years.
# A null `low` is a band published as "unknown"; a `note` marks a band the
# edition gave no figure for.
