summary: "A 1970s automatic that shows the hour as a jumping digit in a window instead of an hour hand. The 119-01-01 has a tonneau case; the 173-01-01 adds a date."
references:
  - number: 119-01-01
    note: "Stainless steel tonneau case, 37 mm, with the minutes and seconds read off the dial."
    cites: [ve-jump-hour]
  - number: 173-01-01
    note: "Automatic Jumping Hour Date in a gold-plated 40.5 x 41.5 mm case on the AS 2073, per its owner."
    cites: [sop-cqly]
