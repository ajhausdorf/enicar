    years:
      from: 1963
      to: 1963
    tell: "Long orange-tipped paddle hands, arrow-shaped register hands, a small applied logo and a triangle pointer on the red ring."
    hands: "Paddle with long orange tips; unpainted chronograph hand with a lume dot, early ones spear-shaped; long arrow-shaped register hands, on later ones only on the 12-hour counter"
    bezel: "Black 60-minute outer bezel, two lume spots at 12; red ring with a triangle pointer"
    dials:
      - "All black"
      - "Black with silver registers"
