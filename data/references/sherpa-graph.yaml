name: Sherpa Graph
family: sherpa
kind: chronograph
summary: The 40 mm Sherpa chronograph on the Valjoux 72, made in seven generations from 1960.
references:
  - number: 1308 BaNCH
    note: null
    cites:
      - eo-chrono-table
  - number: 072/001
    note: null
    cites:
      - eo-chrono-table
  - number: 072-02-01
    note: null
    cites:
      - eo-chrono-table
nicknames:
  - Jim Clark
years:
  from: 1960
  to: 1968
  approximate: true
movement:
  calibres:
    - Valjoux 72
  winding: null
case:
  construction: null
  material: null
  diameter_mm: 40
  lug_mm: null
  thickness_mm: null
features:
  - tachymeter-ring
dial: null
variants:
  - name: MkI
    years:
      from: 1960
      to: 1960
    tell: "White inner tachymetre ring marked Base 1000, large early logo, sword-shaped or paddle hands and a plain unpainted chronograph hand."
    hands: "Sword-shaped (gladius) or paddle; plain unpainted chronograph hand; leaf-shaped register hands"
    bezel: "White inner tachymetre ring, Tachymetre Base 1000"
    dials:
      - "Grey with white registers"
      - "Black with white registers"
    refs:
      - 1308 BaNCH
    serials:
      - 272.5xx – 272.9xx
    dated: 5/60
    production: "500"
    cites:
      - eo-chrono-table
      - e101-graph-mkia
  - name: MkIb
    years:
      from: 1961
      to: 1961
    tell: "Silver tachymetre ring without the word Tachymetre, large early logo, long-tipped paddle hands and a straight red chronograph hand."
    hands: "Paddle with long tips; straight red chronograph hand; arrow-shaped register hands"
    bezel: "Silver inner tachymetre ring without the word Tachymetre (a few have the Base 1000 ring)"
    dials:
      - "Black with white registers (reverse panda)"
      - "White"
      - "Grey with white registers (\"Jim Clark\")"
    refs:
      - 1308 BaNCH
    serials:
      - 409.2xx – 409.6xx
    dated: 11/61
    production: "700"
    cites:
      - eo-chrono-table
      - e101-graph-mkib
  - name: MkIc
    years:
      from: 1962
      to: 1962
    tell: "Silver-white tachymetre ring marked Tachymetre from 300, large early logo, long-tipped paddle hands and a straight red chronograph hand."
    hands: "Paddle with long tips; straight red chronograph hand; arrow-shaped register hands"
    bezel: "Silver-white inner tachymetre ring, Tachymetre from 300"
    dials:
      - "White"
      - "Black with white registers"
      - "Grey with white registers (\"Jim Clark\")"
    refs:
      - 1308 BaNCH
    serials:
      - 526.0xx – 528.0xx
    dated: 4/62
    production: 600+
    cites:
      - eo-chrono-table
      - e101-graph-ic
  - name: MkId
    years:
      from: 1962
      to: 1962
    tell: Serial range 561.7xx – 562.1xx.
    refs:
      - 1308 BaNCH
    serials:
      - 561.7xx – 562.1xx
    dated: 6/62
    production: "500"
    cites:
      - eo-chrono-table
  - name: MkII
    years:
      from: 1963
      to: 1963
    tell: "Small logo above the word Enicar (early 601.xxx watches keep the large logo), white or grey tachymetre ring from 300, unpainted paddle hands and a red chronograph hand (straight, or lollipop on later ones)."
    hands: "Unpainted paddle; straight red chronograph hand, later also lollipop; arrow-shaped, later thin, register hands"
    bezel: "White or grey inner tachymetre ring from 300; some early ones without the word Tachymetre"
    dials:
      - "Black with silver registers"
      - "All black"
      - "White"
      - "White and silver"
    refs:
      - 072/001
    serials:
      - 601.5xx – 601.9xx
      - 617.1xx – 617.5xx
      - 246.1xx – 246.6xx
    dated: 1963 (est.)
    production: 1,500
    cites:
      - eo-chrono-table
      - e101-graph-mkii
      - e101-graph-mk-iib
  - name: MkIII
    years:
      from: 1963
      to: 1966
    tell: "Black or grey tachymetre ring, paddle hands with short orange tips and a chronograph hand with a red dot near the tip."
    hands: "Paddle with short orange tips; chronograph hand with a red dot near the tip; thin register hands"
    bezel: "Black or grey inner tachymetre ring from 300"
    dials:
      - "Black with grey registers"
      - "All black"
      - "White"
      - "White with silver registers"
    refs:
      - 072-02-01
    serials:
      - 635.9xx
      - 641.xxx
      - 835.1xx – 836.2xx
      - 906.4xx
      - 908.0xx – 908.8xx
      - 940.5xx – 941.4xx
    dated: 1963 (est.) to 6/66
    production: 3,200
    cites:
      - eo-chrono-table
      - e101-graph-mkiii
  - name: MkIV
    years:
      from: 1967
      to: 1968
    tell: "Baton hands outlined in white (black on white dials), an orange or red triangle chronograph hand and thick black register hands."
    hands: "Baton, outlined in white (black on white dials); orange or red triangle chronograph hand; thick black register hands, the minute counter often orange or red"
    bezel: "Black, grey or white inner tachymetre ring"
    dials:
      - "Black with white registers"
      - "White with grey or silver registers"
      - "Black with grey registers"
      - "Blue with white registers"
    refs:
      - 072-02-01
    serials:
      - 1.030.1xx – 1.030.8xx
      - 1.261.7xx – 1.263.3xx
    dated: 9/67 to 11/68
    production: 2,400
    cites:
      - eo-chrono-table
      - e101-graph-iv
