dial: null
variants:
  - name: MkI
    years: { from: 1960, to: null }
    tell: "Dauphine hands and a crescent-moon 24-hour hand; early dials carry the old logo with ENICAR inside Saturn."
    calibres: [AR1126]
    hands: "Dauphine; crescent-moon 24-hour hand"
    bezel: "Inner 24-hour bezel, black and white or red and white; red pointer ring"
    dials: ["Black", "Cream or white", "Gold (Rubyrotor)"]
    crowns: Thin
    refs: [100/205]
    cites: [sb-guide, eo-guide]
  - name: MkII
    tell: "Baton hands tipped with lume, a slim 24-hour hand and a seconds hand with a round dot; wider markers with lume dots at 6, 9 and 12."
    calibres: [AR1146]
    hands: "Baton, lume at the tips; slim 24-hour hand, orange-tipped on some; dot seconds hand"
    bezel: "Inner 24-hour bezel, black and yellow more often than black and white; red pointer ring"
    dials: ["Black", "White or cream"]
    crowns: Wider
    refs: [146/001, 148.35.01]
    cites: [sb-guide]
  - name: MkIII
    years: { from: 1968, to: null }
    tell: "Rally-style 24-hour hand, pencil lume in the minute hand and a lozenge lume in the hour hand, applied logo and thick crowns."
    hands: "Baton, pencil lume in the minute hand and lozenge lume in the hour hand; rally-style 24-hour hand; lollipop or red triangle seconds hand"
    bezel: "Inner 24-hour bezel in several colours, some with a checkered chapter ring; red pointer ring"
    dials: ["Black", "White"]
    crowns: Thick
    refs: [148-35-01, 148-35-01A]
    cites: [sb-guide]
  - name: MkIV
    years: { from: 1969, to: null }
    tell: "Cushion case with an orange pointer ring, a checkered chapter ring and black 6, 12, 18 and 24 markers on the inner bezel."
    calibres: [AR166]
    case: Cushion (short-lug)
    bezel: "Multi-coloured inner 24-hour bezel, 6, 12, 18 and 24 in black; orange pointer ring"
    refs: [166-35-04]
    cites: [sb-guide, eo-guide]
  - name: MkIVa
    tell: "A two-ring Saturn logo, no checkered chapter ring, and trapezoid lume plots at the quarter hours; in a cushion or a long-lug case."
    calibres: [AR166]
    case: Cushion (short-lug) or long-lug
    bezel: "Multi-coloured inner 24-hour bezel; the 6, 12, 18 and 24 markers not always in a contrasting colour"
    refs: [166-35-04]
    cites: [sb-guide]
