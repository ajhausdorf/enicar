name: Sherpa Jet
family: sherpa
kind: gmt
summary: The smaller GMT of the Sherpa line, 36 mm (37 mm for the MkIV), with an inner 24-hour bezel, made in four generations from 1963 into the 1970s. The larger sister model is the Sherpa Super-Jet.
references:
  - number: 126/002
    note: From a dealer listing (36.5 mm case); not yet matched to a generation.
    cites: [ct-126-002]
nicknames: []
years: { from: 1963, to: null, approximate: true }
movement:
  calibres: [AR1126, AR1146, AR166]
  winding: automatic
case:
  construction: EPSA bayonet-compressor
  material: null
  diameter_mm: null
  lug_mm: null
  thickness_mm: null
features: [two-crowns, inner-bezel]
dial: null
variants:
  - name: MkI
    years: { from: 1963, to: 1966 }
    tell: Dauphine hands on the earliest examples, paddle hands from about 1965; red crescent-moon GMT indicator.
    diameter_mm: 36
    lug_mm: 18.5
    calibres: [AR1126]
    case: EPSA bayonet-compressor
    hands: Dauphine, later paddle
    bezel: Inner 24-hour, aluminium insert, silver 6 to 18 and black 18 to 6
    dials: [Black, Silver]
    crowns: Thin compressor, crosshatch, Saturn logo
    cites: [eo-jet]
  - name: MkII
    years: { from: 1966, to: 1968 }
    tell: Wider hands, trimmed markers at the cardinal positions, a fuller logo.
    diameter_mm: 36
    lug_mm: 19
    calibres: [AR1146, AR1126]
    case: EPSA bayonet-compressor
    hands: Tuning fork, slim orange or yellow tipped GMT hand
    bezel: Inner 24-hour, slightly thicker, updated numerals
    dials: [Black sunburst, Silver sunburst, Champagne sunburst]
    crowns: Thin or thick compressor, crosshatch, Saturn logo
    cites: [eo-jet]
  - name: MkIII
    years: { from: 1968, to: 1970 }
    tell: Red and black checkered GMT hand and coloured bezels, including red and blue.
    diameter_mm: 36
    lug_mm: 19
    calibres: [AR1146, AR166]
    case: EPSA bayonet-compressor
    hands: Baton, lollipop or orange triangle seconds, checkered GMT hand
    bezel: Inner 24-hour in several colourways, red and blue among them
    dials: [Matte black, Silver, Champagne, Racing dial (two versions)]
    crowns: Thick compressor, crosshatch or smooth, Saturn logo
    cites: [eo-jet]
  - name: MkIV
    years: { from: 1970, to: null }
    tell: Cushion case and racing dial with applied logo.
    diameter_mm: 37
    lug_mm: 19
    calibres: [AR166]
    case: Cushion case
    hands: Large batons, orange-tipped arrow seconds, checkered GMT hand
    bezel: Inner red and blue, yellow markers at the quarter hours
    dials: [Racing dial, applied logo]
    crowns: Thick smooth compressor, Saturn logo
    cites: [eo-jet]
