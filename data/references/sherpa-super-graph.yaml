variants:
  - name: MkI
    years: { from: 1963, to: null }
    tell: "Grey glossy 60-minute bezel, long orange-tipped paddle hands, a spear-tipped chronograph hand and arrow-shaped register hands; Seapearl caseback."
    calibres: [Valjoux 72]
    hands: "Paddle with long orange tips; spear-tipped lumed chronograph hand; arrow-shaped steel register hands"
    bezel: "Grey glossy aluminium 60-minute bezel, no clicks; red ring with a triangle pointer"
    dials: ["Black"]
    crowns: "Compressor crown with Saturn"
    refs: [072/002]
    serials: ["626.6xx", "627.0xx – 627.1xx", "635.8xx", "706.8xx"]
    production: "under 200"
    cites: [e101-sg-mki]
  - name: Simonet
    years: { from: 1964, to: null }
    tell: "Black bezel with red segments, orange markers on the hour counter and an orange-tipped hour-counter hand; made for the shooting events at the 1964 Tokyo Olympics."
    calibres: [Valjoux 72]
    hands: "Paddle with long orange tips; spear-tipped chronograph hand with orange lume; arrow-shaped register hands, the hour-counter hand tipped orange"
    bezel: "Black 60-minute bezel with red segments; red ring with a triangle pointer"
    dials: ["Black with black registers"]
    crowns: "Compressor crown without the Saturn"
    refs: [072/002]
    serials: ["627.0xx – 627.1xx"]
    production: "under 50"
    cites: [e101-sg-simonet]
  - name: MkII
    years: { from: 1966, to: null }
    tell: "Shorter orange tips on the paddle hands, a chronograph hand with a red dot near the tip, and thin, short unpainted register hands; Sherpa 300 caseback."
    calibres: [Valjoux 72]
    hands: "Paddle with short orange tips; chronograph hand with a red dot near the tip; thin unpainted register hands"
    bezel: "Grey glossy aluminium 60-minute bezel; red ring with a triangle pointer"
    dials: ["Black", "White (one known, as a spare)"]
    crowns: "Compressor crown with Saturn"
    refs: [072-02-02]
    serials: ["906.7xx"]
    production: "about 100"
    cites: [e101-sg-mkii]
  - name: MkIII
    years: { from: 1969, to: null }
    tell: "Baton hands outlined in white, a red or orange lollipop or triangle chronograph hand and thicker black register hands, with a rally-style minute track."
    calibres: [Valjoux 72]
    hands: "Baton, outlined in white; red or orange lollipop or triangle chronograph hand; thick black register hands"
    bezel: "Grey glossy aluminium 60-minute bezel; red ring with a triangle pointer"
    dials: ["Black with white registers"]
    refs: [072-02-02]
    serials: ["1.070.1xx", "1.321.9xx"]
    cites: [e101-sg-mkiii]
