name: Sherpa Super-Jet
family: sherpa
kind: gmt
summary: The larger GMT of the Sherpa line, 40 mm (42 mm for the MkIV), sister to the Sherpa Jet, made in four generations from 1963 into the 1970s.
references:
  - number: 146/003
    note: From a dealer listing dated 1964 (40 mm case); not yet matched to a generation.
    cites: [ct-146-003]
nicknames: []
years: { from: 1963, to: null, approximate: true }
movement:
  calibres: [AR1126, AR1146, AR166]
  winding: automatic
case:
  construction: EPSA bayonet-compressor
  material: null
  diameter_mm: null
  lug_mm: null
  thickness_mm: null
features: [two-crowns, inner-bezel]
dial: null
variants:
  - name: MkI
    years: { from: 1963, to: 1966 }
    tell: Dauphine hands on the earliest examples, paddle hands from about 1965; red-tipped needle GMT hand.
    diameter_mm: 40
    lug_mm: 20
    calibres: [AR1126]
    case: EPSA bayonet-compressor
    hands: Dauphine, later paddle
    bezel: Inner 24-hour, aluminium insert, silver 6 to 18 and black 18 to 6
    dials: [Black, Silver]
    crowns: Thin compressor, crosshatch, Saturn logo
    barometer:
      edition: "#7, December 2025"
      cite: eo-barometer-7
      currency: EUR
      entries:
        - label: "Super-Jet Mk I and II"
          bands:
            - { condition: "Very good to mint", low: 3500, high: 6000 }
            - { condition: "Average to good", low: 2000, high: 3500 }
            - { condition: "Poor to fair", low: 1000, high: 2000 }
          note: null
    cites: [eo-jet]
  - name: MkII
    years: { from: 1966, to: 1968 }
    tell: Wider hands, trimmed markers at the cardinal positions, a fuller logo.
    diameter_mm: 40
    lug_mm: 20
    calibres: [AR1146, AR1126]
    case: EPSA bayonet-compressor
    hands: Tuning fork, slim orange or yellow tipped GMT hand
    bezel: Inner 24-hour, slightly thicker, updated numerals
    dials: [Black sunburst, Silver sunburst, Champagne sunburst]
    crowns: Thin or thick compressor, crosshatch, Saturn logo
    barometer:
      edition: "#7, December 2025"
      cite: eo-barometer-7
      currency: EUR
      entries:
        - label: "Super-Jet Mk I and II"
          bands:
            - { condition: "Very good to mint", low: 3500, high: 6000 }
            - { condition: "Average to good", low: 2000, high: 3500 }
            - { condition: "Poor to fair", low: 1000, high: 2000 }
          note: null
    cites: [eo-jet]
  - name: MkIII
    years: { from: 1968, to: 1970 }
    tell: Red and black checkered GMT hand; the Super-Jet's bezel came in black and white only.
    diameter_mm: 40
    lug_mm: 20
    calibres: [AR1146, AR166]
    case: EPSA bayonet-compressor
    hands: Baton, lollipop or orange triangle seconds, checkered GMT hand
    bezel: Inner 24-hour, black and white
    dials: [Matte black, Silver, Champagne]
    crowns: Thick compressor, crosshatch or smooth, Saturn logo
    cites: [eo-jet]
  - name: MkIV
    years: { from: 1970, to: null }
    tell: Cushion case, matte black dial with 3D-globe logo, bold bezel with numerals.
    diameter_mm: 42
    lug_mm: 22
    calibres: [AR166]
    case: Cushion case
    hands: Large batons, orange-tipped arrow seconds, checkered GMT hand
    bezel: Large two-way bezel with numerals and luminous details
    dials: [Matte black, 3D-globe logo]
    crowns: Thick smooth compressor, Saturn logo
    barometer:
      edition: "#7, December 2025"
      cite: eo-barometer-7
      currency: EUR
      entries:
        - label: "Super-Dive MkIII and Super-Jet Mk III, cushion case"
          bands:
            - { condition: "Very good to mint", low: 2500, high: 3500 }
            - { condition: "Average to good", low: 2000, high: 2500 }
            - { condition: "Poor to fair", low: 1500, high: 2000 }
          note: "The Barometer calls the cushion-case Super-Jet the Mk III; enicar.org's Jet article, which this site follows, calls it the MkIV."
    cites: [eo-jet]
