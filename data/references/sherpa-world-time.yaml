name: Sherpa World Time
family: sherpa
kind: other
summary: "A 1967 world-time prototype on the AR 1145 automatic, with six small dials for six time zones and an inner ring of 64 cities. It was shown at the 1967 Swiss watch fair but never went into production."
references: []
nicknames: ["Kaleidoscope"]
years: { from: 1967, to: null, approximate: true }
movement:
  calibres: [AR1145]
  winding: automatic
case:
  construction: "40 x 45 mm case with no reference number on the back"
  material: Stainless steel
  diameter_mm: 40
  lug_mm: 18
  thickness_mm: 10
features: [inner-bezel]
dial: "Six small dials, one per time zone, each with its own hand and arrow disc, around the main hands; 64 city names on the inner ring."
history:
  - text: "Enicar presented it at the 1967 Swiss watch fair. The Musée international d'horlogerie in La Chaux-de-Fonds has one in its collection and, according to the museum, it was one of a series of three prototypes. The seller of Martijn van der Ven's example said ten were made."
    cites: [eo-ws-discovery, vv-ws-mih, vv-ws-mih-show]
