history:
  - text: "Europa Star announced the Super Quartz models in 1974. Martijn van der Ven reads them as Enicar's attempt to answer cheaper Japanese quartz watches. The trapezium version is 17 mm between the lugs at 6 and 24 mm at 12."
    cites: [vv-sq-1974, vv-sq-japan, eo-fearless]
  - text: "Examples he shows include a hexagon case, an octagon case and an asymmetric gold-coloured case, all dated about 1975."
    cites: [vv-sq-hexagon, vv-sq-octagon, vv-sq-asym]
