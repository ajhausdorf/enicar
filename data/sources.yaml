# Sources we draw on. A source stays `to-confirm` until someone has checked
# the URL and who runs it; author names are left null until confirmed.
- id: enicar-org
  name: enicar.org
  kind: blog
  tier: primary
  url: https://enicar.org/
  author: Martijn van der Ven
  status: confirmed
  what: Research blog on Enicar S.A. by collector Martijn van der Ven, with articles on individual models, generations and dating, plus a periodic watch value barometer.
  use: Specs and generation breakdowns, cited per page. We link to his articles for the story rather than retelling it.
  leads_to: [Enicar book MkIII, Enicar 101, Vintage Enicar, Enicar Forums]
  permission: not-asked
- id: watchuseek
  name: WatchUSeek Enicar collecting thread
  kind: forum
  tier: secondary
  url: https://www.watchuseek.com/
  author: null
  status: to-confirm
  what: Owner-posted examples and discussion of dial, hand and case variants.
  use: Variant tells and caseback or serial observations.
  leads_to: []
  permission: not-needed
- id: craft-and-tailored
  name: Craft & Tailored
  kind: dealer
  tier: listing
  url: https://www.craftandtailored.com/
  author: null
  status: confirmed
  what: Vintage watch dealer whose listings give reference numbers and case sizes.
  use: Reference numbers only, until a catalogue or primary source confirms them.
  leads_to: []
  permission: not-needed
- id: wikimedia-commons
  name: Wikimedia Commons
  kind: commons
  tier: secondary
  url: https://commons.wikimedia.org/
  author: null
  status: confirmed
  what: Freely licensed media repository. Uploaders describe their own photos.
  use: Openly licensed photographs, with the uploader's description as a weak source for specs.
  leads_to: []
  permission: not-needed
- id: two-crowned-prints
  name: "@two_crowned_prints (James)"
  kind: other
  tier: secondary
  url: https://www.instagram.com/two_crowned_prints/
  author: James
  status: confirmed
  what: Instagram account of a collector of vintage Enicar Sherpa watches, with photos and captions describing each watch.
  use: Photos, with permission, and the owner's own identification of a watch's model or generation where he gives one.
  leads_to: []
  permission: granted
- id: zizi-zap
  name: "@zizi_zap"
  kind: other
  tier: secondary
  url: https://www.instagram.com/zizi_zap/
  author: null
  status: confirmed
  what: Instagram account of a collector of vintage Enicar, mostly Sherpa Super-Jets and Super-Dives, whose captions often give the reference and calibre.
  use: Photos, with permission, and the owner's own reference and calibre for a watch.
  leads_to: []
  permission: granted
- id: dropandwatch
  name: Drop&Watch
  kind: dealer
  tier: listing
  url: https://dropandwatch.com/
  author: null
  status: confirmed
  what: French vintage watch dealer that photographs and sells serviced watches.
  use: Photos, with permission, and their description of a watch they sold.
  leads_to: []
  permission: granted
